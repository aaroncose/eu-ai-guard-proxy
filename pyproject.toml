[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-ai-guard-proxy"
version = "1.1.0"
description = "EU AI Act Audit & Agent Governance Gateway"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "aioboto3>=13.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "cryptography>=43.0.0",
    "streamlit>=1.38.0",
    "pyasn1>=0.6.0",
    "pyasn1-modules>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["proxy*", "dashboard*"]
exclude = ["data*", "tests*"]